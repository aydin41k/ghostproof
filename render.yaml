# Prepared only. Connecting/creating a service requires owner authorization.
# Static sites have no runtime plan, model, secret or persistent backend.
services:
  - type: web
    name: ghostproof
    runtime: static
    buildCommand: python3 tools/build_site.py
    staticPublishPath: ./site
    autoDeployTrigger: 'off'
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
