name: Validate source-reviewed static release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Game, rendering and release boundary tests
        run: |
          node --test tests/*.test.js
          node --check demo/app.js
          node --check demo/game.js
          python3 -m unittest discover -s tests -p 'test*.py' -v
          python3 tools/validate_release.py
          python3 tools/build_site.py
          python3 tools/package_release.py --smoke
      - name: Small reviewed source package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghostproof-source
          path: |
            dist/ghostproof-1.0.0.zip
            dist/ghostproof-1.0.0.zip.sha256
            dist/source-manifest.sha256
          if-no-files-found: error
          retention-days: 3
